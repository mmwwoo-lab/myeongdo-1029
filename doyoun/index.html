<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도윤이의 성장 시집</title><style>body{margin:0;background:#eee6ee;color:#423b42;font-family:system-ui;text-align:center}header{background:#dfc9e6;padding:22px}main{max-width:900px;margin:20px auto;background:#fffaf6;padding:22px;border-radius:16px;box-shadow:0 10px 30px #0002}h1{font-size:clamp(25px,5vw,42px)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.photo{background:#fff;padding:9px;box-shadow:0 3px 10px #0002;transform:rotate(var(--r));border-radius:7px}.photo img{width:100%;height:190px;object-fit:contain;background:#f6f1ef}.photo small{display:block;margin:8px}button{margin:12px;padding:12px 24px;border:0;border-radius:30px;background:#80658d;color:white}footer{padding:20px}@media(max-width:520px){.photo img{height:145px}}</style><header><h1>도윤이, 사랑을 먹고 자라는 중 ♡</h1><p>2025년 12월 16일 태어난 우리의 작은 기적</p></header><main><h2 id="title"></h2><p id="poem"></p><div class="grid" id="grid"></div><button onclick="go(-1)">이전 장</button><span id="count"></span><button onclick="go(1)">다음 장</button><p>외할아버지, 외할머니, 아빠, 엄마의 사랑으로 하루하루 자라나는 도윤이에게.</p></main><footer>명도재 가족 성장 기록</footer><script>const ids=["1000177016","1000177017","1000177018","1000177019","1000177020","1000177022","1000177023","1000177024","1000177025","1000177027","1000177028","1000177029","1000177030","1000177031","1000177032","1000177033","1000177034","1000177035","1000177038","1000177039","1000177040","1000177041","1000177042","1000177043","1000177044","1000177045","1000177046","1000177047","1000177048","1000177049","1000177050","1000177051","1000177052","1000177053","1000177054"];const titles=['사랑이 태어난 날','오늘도 웃음이 반짝','세상을 배우는 작은 손','가족이라는 포근한 품','하루하루 쑥쑥','도윤이의 행복한 오늘'];const captions=['오늘도 사랑받는 중 ♡','이 표정, 저장 완료!','행복이 한 뼘 자랐어요','도윤이의 하루는 반짝반짝','우리 집 최고 귀염둥이','웃음이 피어나는 순간'];let page=0;function go(n){page=Math.max(0,Math.min(Math.ceil(ids.length/6)-1,page+n));render()}function render(){document.getElementById('title').textContent=titles[page];document.getElementById('poem').textContent='작은 눈빛 하나에 온 가족의 하루가 환해집니다.';document.getElementById('count').textContent=(page+1)+' / '+Math.ceil(ids.length/6);document.getElementById('grid').innerHTML=ids.slice(page*6,page*6+6).map((id,i)=>'<div class="photo" style="--r:'+(i%2?2:-2)+'deg"><img src="photos/'+id+'.jpg" alt="도윤이 성장 사진" loading="lazy"><small>'+captions[(page*6+i)%6]+'</small></div>').join('')}render()</script></html>
