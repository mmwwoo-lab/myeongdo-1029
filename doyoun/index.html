<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#eee6ed"><title>도윤이의 성장 시집</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Georgia,'Noto Serif KR','Malgun Gothic',serif;color:#39333c;background:#f2edf3}header{height:68px;background:#e6dbe9;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:10px}header strong{font-size:clamp(15px,2vw,22px)}button,select{font:inherit;border:1px solid #c7b8c9;background:white;color:#3e3440;border-radius:9px;padding:9px 13px;cursor:pointer}button:hover{background:#f7eefa}.stage{height:calc(100dvh - 132px);min-height:390px;display:flex;justify-content:center;align-items:center;padding:12px}.book{width:min(1100px,100%);height:100%;background:#fffdf9;box-shadow:0 12px 45px #49394c35;border-radius:12px;overflow:hidden;position:relative}.page{height:100%;display:flex;flex-direction:column;padding:clamp(14px,3vh,34px) clamp(15px,4vw,55px);text-align:center;overflow:auto}.page h1{font-size:clamp(24px,4vw,48px);margin:12px 0}.page h2{font-size:clamp(19px,3vw,32px);margin:8px 0 18px}.page .body{white-space:pre-line;line-height:2.1;font-size:clamp(15px,1.8vw,21px);margin:auto}.cover{background:linear-gradient(140deg,#f6eff8,#fff9ee)}.cover img{height:58%;max-width:80%;object-fit:contain;border-radius:12px;margin:auto}.poem{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;height:100%}.poem img{width:100%;height:100%;max-height:60vh;object-fit:contain;border-radius:12px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:9px;flex:1;min-height:0}.gallery img{width:100%;height:100%;object-fit:contain;background:#f5f1ee;border-radius:7px;cursor:zoom-in}.gallery figure{margin:0;min-height:0;overflow:hidden}.toolbar{height:64px;display:flex;align-items:center;justify-content:center;gap:12px}.count{min-width:90px;text-align:center}.toc{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;max-width:640px;width:100%;margin:15px auto}.toc button{text-align:left}.foot{font-size:12px;color:#827687;margin-top:8px}.lightbox{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:20;padding:30px}.lightbox.open{display:flex}.lightbox img{max-height:92%;max-width:95%;object-fit:contain}.lightbox button{position:absolute;right:15px;top:15px}.muted{font-size:13px;color:#746a75}@media(max-width:650px){header{height:58px;padding:0 9px}header button{padding:7px;font-size:12px}.stage{height:calc(100dvh - 115px);padding:7px}.toolbar{height:57px}.page{padding:12px}.poem{display:flex;flex-direction:column;gap:5px}.poem img{max-height:36%;height:36%;width:100%}.poem .body{line-height:1.75}.gallery{gap:5px}.toc{grid-template-columns:1fr}.cover img{max-width:95%}}</style></head><body><header><strong>🌸 도윤이의 성장 시집</strong><div><button id="menu">☷ 목차</button> <button id="speak">🔊 이 페이지 읽기</button></div></header><main class="stage"><article class="book" id="book" aria-live="polite"></article></main><nav class="toolbar"><button id="prev">← 이전</button><span class="count" id="counter"></span><button id="next">다음 →</button></nav><div class="lightbox" id="lightbox"><button id="close">✕ 닫기</button><img id="zoom" alt="확대 사진"></div><script>
const pages=[{"type": "cover", "title": "도윤이의 성장 시집", "subtitle": "사진으로 쓴 사랑 · 가족이 함께 만든 성장 기록", "images": ["1000177016.jpg"]}, {"type": "intro", "title": "책을 열며", "text": "도윤이의 작은 손과 환한 웃음, 호기심 가득한 눈빛을 오래 간직하고 싶었습니다. 평범한 하루가 모여 특별한 성장의 이야기가 됩니다. 이 책은 사진으로 남긴 사랑의 기록입니다."}, {"type": "toc", "title": "차례"}, {"type": "poem", "title": "작은 우주", "text": "작은 손 하나가\n우리 집의 계절을 바꾸었다.\n눈을 맞추면 봄이 오고\n웃음 한 번에 햇살이 번진다.\n도윤아, 너의 하루가\n우리에게는 한 권의 시란다.", "images": ["1000177016.jpg"]}, {"type": "poem", "title": "한 숟가락의 세상", "text": "조그만 입을 벌려\n세상의 맛을 배운다.\n한 숟가락에는 정성이 담기고\n입가에 묻은 밥풀에는\n오늘도 무럭무럭 자라는\n행복이 묻어난다.", "images": ["1000177023.jpg"]}, {"type": "poem", "title": "첫걸음", "text": "두 손으로 세상을 붙잡고\n한 발, 또 한 발.\n넘어져도 다시 일어서는\n작은 용기를 바라본다.\n네가 내딛는 모든 길에\n사랑이 먼저 가 있기를.", "images": ["1000177030.jpg"]}, {"type": "poem", "title": "웃음꽃", "text": "까르르, 작은 웃음이\n온 방에 꽃처럼 피어난다.\n눈을 찡그린 표정도\n장난기 가득한 얼굴도\n우리에게는 오래 간직할\n눈부신 오늘의 선물.", "images": ["1000177038.jpg"]}, {"type": "poem", "title": "함께라는 이름", "text": "식탁에 둘러앉은 얼굴들\n너를 바라보며 환해진다.\n손에서 손으로 건네는 온기\n사랑은 거창한 말이 아니라\n함께 밥을 먹고 웃는\n이 평범하고 귀한 시간.", "images": ["1000177044.jpg"]}, {"type": "poem", "title": "도윤이에게", "text": "도윤아, 천천히 자라렴.\n세상이 넓다는 것을 알게 될 때\n언제든 돌아와 쉴 수 있는\n따뜻한 품이 있음을 기억하렴.\n오늘의 너를 사랑하고\n내일의 너를 응원한다.", "images": ["1000177050.jpg"]}, {"type": "gallery", "title": "성장의 순간 1", "images": ["1000177016.jpg", "1000177017.jpg", "1000177018.jpg", "1000177019.jpg", "1000177020.jpg", "1000177022.jpg"]}, {"type": "gallery", "title": "성장의 순간 2", "images": ["1000177023.jpg", "1000177024.jpg", "1000177025.jpg", "1000177027.jpg", "1000177028.jpg", "1000177029.jpg"]}, {"type": "gallery", "title": "성장의 순간 3", "images": ["1000177030.jpg", "1000177031.jpg", "1000177032.jpg", "1000177033.jpg", "1000177034.jpg", "1000177035.jpg"]}, {"type": "gallery", "title": "성장의 순간 4", "images": ["1000177038.jpg", "1000177039.jpg", "1000177040.jpg", "1000177041.jpg", "1000177042.jpg", "1000177043.jpg"]}, {"type": "gallery", "title": "성장의 순간 5", "images": ["1000177044.jpg", "1000177045.jpg", "1000177046.jpg", "1000177047.jpg", "1000177048.jpg", "1000177049.jpg"]}, {"type": "gallery", "title": "성장의 순간 6", "images": ["1000177050.jpg", "1000177051.jpg", "1000177052.jpg", "1000177053.jpg", "1000177054.jpg"]}, {"type": "letter", "title": "사랑하는 도윤이에게", "text": "도윤아, 네가 웃으면 우리도 웃고, 네가 한 걸음 내딛으면 우리 마음도 함께 설렌단다. 오늘 사진 속의 작은 순간들이 훗날 너에게 따뜻한 기억이 되기를 바란다. 언제나 건강하고 밝게 자라렴.\n\n사랑을 담아, 할머니·할아버지가."}];let current=0;const book=document.getElementById('book'),counter=document.getElementById('counter');const photo=n=>'photos/'+encodeURIComponent(n);function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stop(){if('speechSynthesis' in window)speechSynthesis.cancel()}function render(){stop();let p=pages[current],s='';if(p.type==='cover')s=`<div class="page cover"><div class="muted">MY GROWING DAYS · PHOTO POETRY BOOK</div><h1>${esc(p.title)}</h1><p>${esc(p.subtitle)}</p><img src="${photo(p.images[0])}" alt="표지 사진"><div class="foot">명도재 가족 성장 기록</div></div>`;else if(p.type==='toc')s=`<div class="page"><h2>차례</h2><div class="toc">${pages.map((x,i)=>i>2?`<button data-page="${i}">${String(i+1).padStart(2,'0')} · ${esc(x.title)}</button>`:'').join('')}</div></div>`;else if(p.type==='gallery')s=`<div class="page"><h2>${esc(p.title)}</h2><div class="gallery">${p.images.map((n,i)=>`<figure><img loading="lazy" src="${photo(n)}" alt="도윤이 성장 사진 ${i+1}" data-photo="${esc(n)}"></figure>`).join('')}</div><div class="foot">사진을 누르면 크게 볼 수 있습니다</div></div>`;else if(p.type==='poem')s=`<div class="page"><h2>${esc(p.title)}</h2><div class="poem"><img src="${photo(p.images[0])}" alt="시와 함께하는 사진"><div class="body">${esc(p.text)}</div></div></div>`;else s=`<div class="page"><h2>${esc(p.title)}</h2><div class="body">${esc(p.text)}</div></div>`;book.innerHTML=s;counter.textContent=`${current+1} / ${pages.length}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===pages.length-1;document.getElementById('speak').style.display=['poem','intro','letter'].includes(p.type)?'inline-block':'none';book.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(+b.dataset.page));book.querySelectorAll('[data-photo]').forEach(img=>img.onclick=()=>{document.getElementById('zoom').src=img.src;document.getElementById('lightbox').classList.add('open')})}function go(i){current=Math.max(0,Math.min(pages.length-1,i));render()}document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('menu').onclick=()=>go(2);document.getElementById('speak').onclick=()=>{if(!('speechSynthesis'in window)){alert('이 브라우저는 음성 읽기를 지원하지 않습니다.');return}stop();let p=pages[current],u=new SpeechSynthesisUtterance(p.title+'. '+p.text);u.lang='ko-KR';u.rate=.85;speechSynthesis.speak(u)};document.getElementById('close').onclick=()=>document.getElementById('lightbox').classList.remove('open');document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')e.currentTarget.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1);if(e.key==='Escape')document.getElementById('lightbox').classList.remove('open')});render();</script></body></html>
